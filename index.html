<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Board — Community Safety Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#101a4d; --night-deep:#0a1136;
    --lime:#c8f531; --siren:#ff3b4e; --beacon:#2bb3ff;
    --amber:#ffc53d; --paper:#f5f8ff;
    --display:"Bungee", system-ui, sans-serif;
    --body:"Outfit", system-ui, sans-serif;
    --util:"DM Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    background:var(--night-deep);
    background-image:
      repeating-linear-gradient(135deg,
        rgba(200,245,49,.05) 0 46px, rgba(255,255,255,0) 46px 92px),
      radial-gradient(120% 90% at 50% -10%, #1c2b78 0%, var(--night) 45%, var(--night-deep) 100%);
    background-attachment:fixed;
    color:var(--paper);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}

  /* ---------- monitor ---------- */
  .monitor{
    border-bottom:3px solid rgba(200,245,49,.35);
    background:linear-gradient(180deg, rgba(10,17,54,.9), rgba(10,17,54,0));
    padding:10px 0 0;
  }
  .monitor-inner{max-width:1120px;margin:0 auto;padding:0 20px}
  .monitor svg{display:block;width:100%;height:96px;overflow:visible}
  .ecg-line{fill:none;stroke:var(--lime);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 10px rgba(200,245,49,.55))}
  .ecg-flat{stroke:rgba(200,245,49,.18);stroke-width:3;filter:none}
  #scanner{fill:#fff;opacity:.9;filter:drop-shadow(0 0 8px var(--lime))}
  .ecg-readout{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--util);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(200,245,49,.75);padding:2px 0 10px}

  /* ---------- hero ---------- */
  header.hero{padding:44px 0 8px;text-align:center}
  .eyebrow{font-family:var(--util);font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--beacon);margin:0 0 14px}
  h1{font-family:var(--display);font-size:clamp(2.4rem,9vw,5rem);line-height:.94;margin:0;
    color:var(--paper);text-shadow:3px 3px 0 var(--siren), 6px 6px 0 var(--beacon)}
  .lede{font-size:clamp(1rem,2.6vw,1.3rem);max-width:34ch;margin:22px auto 0;
    color:rgba(245,248,255,.82)}
  .tally{display:inline-flex;align-items:center;gap:12px;margin-top:26px;padding:10px 22px;
    border-radius:999px;background:var(--lime);color:var(--night-deep);
    font-family:var(--util);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
    box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .tally b{font-family:var(--display);font-size:20px;line-height:1}

  /* ---------- board ---------- */
  .board{display:grid;gap:22px;margin-top:46px;grid-template-columns:1fr}
  @media (min-width:560px){.board{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:920px){.board{grid-template-columns:repeat(3,1fr)}}

  .badge{
    position:relative;appearance:none;font:inherit;color:inherit;text-align:center;cursor:pointer;
    border:3px dashed rgba(245,248,255,.28);border-radius:26px;
    background:rgba(255,255,255,.045);padding:26px 20px 22px;overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, background .3s ease;
  }
  .badge:hover{transform:translateY(-4px);border-color:rgba(245,248,255,.5)}
  .badge:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
  .badge:active{transform:translateY(1px) scale(.985)}

  .patch{
    width:132px;height:132px;margin:0 auto 18px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.06);
    border:3px dashed rgba(245,248,255,.3);
    transition:background .35s ease, border-color .35s ease, transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  .patch svg{width:70px;height:70px;display:block}
  .patch svg *{stroke:rgba(245,248,255,.45);fill:none;stroke-width:5;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s ease}

  .badge h2{font-family:var(--display);font-size:1.15rem;line-height:1.15;margin:0 0 8px;
    color:rgba(245,248,255,.6);transition:color .3s ease}
  .badge p{margin:0 0 16px;font-size:.98rem;color:rgba(245,248,255,.55);min-height:2.6em}
  .status{display:inline-block;font-family:var(--util);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;padding:7px 14px;border-radius:999px;
    background:rgba(255,255,255,.08);color:rgba(245,248,255,.6);
    transition:background .3s ease,color .3s ease}

  .badge.earned{
    border-style:solid;border-color:var(--c);
    background:radial-gradient(80% 70% at 50% 0%, color-mix(in srgb,var(--c) 26%,transparent), transparent 70%), rgba(255,255,255,.06);
    box-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000);
  }
  .badge.earned .patch{background:var(--c);border-style:solid;border-color:rgba(255,255,255,.85);
    box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--c) 60%,#000)}
  .badge.earned .patch svg *{stroke:#fff}
  .badge.earned h2{color:var(--paper)}
  .badge.earned p{color:rgba(245,248,255,.8)}
  .badge.earned .status{background:var(--c);color:#0a1136;font-weight:500}

  .pop{animation:pop .5s cubic-bezier(.2,1.7,.4,1)}
  @keyframes pop{0%{transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.14) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
  .wiggle{animation:wiggle .4s ease}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

  .spark{position:absolute;top:52px;left:50%;width:11px;height:11px;border-radius:3px;
    pointer-events:none;animation:fly .85s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot))}}

  /* ---------- badge controls ---------- */
  .badge-controls{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .learn-btn{appearance:none;background:rgba(245,248,255,.08);border:2px solid rgba(245,248,255,.25);
    color:rgba(245,248,255,.7);cursor:pointer;border-radius:12px;padding:8px 14px;font-size:.85rem;
    font-family:var(--body);letter-spacing:.05em;transition:.2s ease;font-weight:500}
  .learn-btn:hover{background:rgba(245,248,255,.14);border-color:rgba(245,248,255,.4);color:var(--paper)}
  .learn-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  /* ---------- finish ---------- */
  .finish{margin-top:44px;padding:34px 26px;text-align:center;border-radius:28px;display:none;
    background:linear-gradient(100deg,var(--siren),var(--amber) 45%,var(--lime));color:var(--night-deep)}
  .finish.show{display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  .finish h3{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);margin:0 0 10px}
  .finish p{margin:0 auto;max-width:40ch;font-size:1.1rem;font-weight:600}

  footer{margin-top:40px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{appearance:none;background:none;cursor:pointer;border:2px solid rgba(245,248,255,.25);
    border-radius:999px;color:rgba(245,248,255,.6);font-family:var(--util);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;transition:.2s}
  .btn:hover{color:var(--paper);border-color:var(--paper)}
  .btn:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
  .btn.armed{border-color:var(--siren);color:var(--siren)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- modal ---------- */
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal-content{background:linear-gradient(135deg, rgba(16,26,77,.98), rgba(10,17,54,.98));
    border:2px solid rgba(200,245,49,.35);border-radius:28px;max-width:600px;width:100%;
    max-height:80vh;overflow-y:auto;padding:40px 32px;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.8)}
  .modal-close{position:absolute;top:20px;right:20px;background:none;border:none;
    color:var(--paper);font-size:28px;cursor:pointer;padding:0;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;transition:.2s}
  .modal-close:hover{color:var(--lime)}
  .modal h2{font-family:var(--display);font-size:2rem;color:var(--paper);margin:0 0 16px}
  .modal-color-accent{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px}
  .modal-body{color:rgba(245,248,255,.8);line-height:1.6;font-size:.95rem}
  .modal-loading{text-align:center;padding:40px 20px;color:rgba(200,245,49,.75)}
  .modal-error{color:var(--siren);padding:20px;background:rgba(255,59,78,.1);border-radius:12px;border-left:4px solid var(--siren)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="monitor">
  <div class="monitor-inner">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="ecg-line ecg-flat" d="M 0 60 L 1200 60"></path>
      <path class="ecg-line" id="ecg" d="M 0 60 L 1200 60"></path>
      <circle id="scanner" cx="0" cy="60" r="7"></circle>
    </svg>
    <div class="ecg-readout"><span>Badge monitor</span><span id="readout">0 beats</span></div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Community Safety Day</p>
    <h1>Badge<br>Board</h1>
    <p class="lede">Finish a station, then tap its badge to collect it.</p>
    <div class="tally"><b id="count">0</b> of 6 collected</div>
  </header>

  <main class="board" id="board"></main>

  <section class="finish" id="finish" aria-live="polite">
    <h3>Congratulations! 🎉</h3>
    <p>You've completed all six stations and earned your Community Safety Day badge. Fantastic work!</p>
  </section>

  <footer>
    <button class="btn" id="sound">Sound: on</button>
    <button class="btn" id="reset">Start over</button>
  </footer>
</div>

<!-- Modal for Learn More content -->
<div class="modal" id="learnModal" role="dialog" aria-hidden="true">
  <div class="modal-content">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<p class="sr" aria-live="polite" id="announce"></p>

<script>
const STATIONS = [
  { id:"bleed", name:"Stop the Bleed", blurb:"Pack it, press it, wrap it.", color:"#ff3b4e",
    icon:`<path d="M50 12 C50 12 24 42 24 60 a26 26 0 0 0 52 0 C76 42 50 12 50 12 Z"/><path d="M36 60 h28"/><path d="M50 46 v28"/>`,
    hasLearnMore:true, githubTopic:"tourniquet-application" },
  { id:"cpr", name:"CPR", blurb:"Push hard, push fast, don't stop.", color:"#ff8a3d",
    icon:`<path d="M50 82 C50 82 16 60 16 38 A18 18 0 0 1 50 30 A18 18 0 0 1 84 38 C84 60 50 82 50 82 Z"/><path d="M22 48 h14 l7 -14 l9 26 l7 -12 h19"/>`,
    hasLearnMore:true, githubTopic:"cpr-training" },
  { id:"aed", name:"Public Access Defibs", blurb:"Find it, open it, follow the voice.", color:"#2bb3ff",
    icon:`<rect x="18" y="20" width="64" height="60" rx="10"/><path d="M56 32 L38 56 h13 l-7 18 l19 -26 H50 Z"/>`,
    hasLearnMore:true, githubTopic:"aed-use" },
  { id:"sar", name:"Search and Rescue", blurb:"Look, listen, and find.", color:"#c8f531",
    icon:`<path d="M40 50 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 M50 40 v20 M40 50 h20"/><path d="M25 50 a25 25 0 1 0 50 0 a25 25 0 1 0 -50 0"/>` },
  {  id:"truck", name:"Touch a Truck", blurb:"Climb in. Try the lights.", color:"#ffc53d",
    icon:`<path d="M10 66 V38 h44 v28"/><path d="M54 46 h18 l14 14 v6 H54"/><circle cx="30" cy="72" r="8"/><circle cx="70" cy="72" r="8"/><path d="M26 24 h22"/><path d="M37 18 v6"/>` }
},
{id:"community-paramedic",name:"Community Paramedics",blurb:"Keeping people healthy at home and in the community.",color:"#7f5af0",icon:`
<rect x="28" y="20" width="44" height="60" rx="6"/>
<path d="M50 32 v24"/>
<path d="M38 44 h24"/>
<path d="M36 80 h28"/>
`,
hasLearnMore:true,
githubTopic:"community-paramedicine"
}
];

/* Audio context setup */
let soundOn = true, ac, memoryOnly;
const KEY = "badges:csd2024";
const soundBtn = document.getElementById("sound");
const countEl = document.getElementById("count");
const resetBtn = document.getElementById("reset");
const readout = document.getElementById("readout");
const finish = document.getElementById("finish");
const announce = document.getElementById("announce");
const board = document.getElementById("board");
const learnModal = document.getElementById("learnModal");
const modalClose = document.getElementById("modalClose");
const modalBody = document.getElementById("modalBody");
let earned = new Set();

function audio(){ return ac || (ac = new (window.AudioContext||window.webkitAudioContext)(), true); }

/* struck-bell voice: fundamental plus inharmonic partials, fast attack, long tail */
function bell(freq, when = 0, dur = 1.3, vol = .3){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime + when;
  [[1,1,1],[2.01,.42,.62],[3.02,.2,.42],[4.24,.1,.3],[5.43,.05,.22]].forEach(([m,a,d]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq*m, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol*a, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur*d);
    o.connect(g); g.connect(dry); g.connect(wet);
    o.start(t); o.stop(t + dur + .1);
  });
}

/* dry mechanical click — filtered noise transient, ~12 ms */
function click(vol = .3){
  if(!soundOn || !audio()) return;
  const t = ac.currentTime, n = Math.floor(ac.sampleRate * .012);
  const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 7);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2700; bp.Q.value = .9;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(dry);
  src.start(t);
}

/* pentatonic run — the nth badge collected is the nth note, so any order sounds right */
const RUN = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
function collectTone(n){
  const f = RUN[Math.min(n, RUN.length) - 1];
  bell(f, 0, 1.5, .3);
  bell(f*2, .055, .9, .12);
}
function fanfare(){
  [523.25, 659.25, 783.99, 1046.50].forEach((f,i) => bell(f, i*.11, 1.5, .26));
  bell(1318.51, .46, 2.6, .3);
  bell(261.63, .46, 2.8, .18);
}
function thud(){ bell(196, 0, .5, .16); }
function downRun(){ [659.25,523.25,392].forEach((f,i)=>bell(f, i*.1, .8, .18)); }

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "Sound: on" : "Sound: off";
  if(soundOn){ click(.25); bell(783.99, .04, 1, .26); }
});

/* ---------- storage ---------- */
async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  return memoryOnly ? JSON.parse(memoryOnly) : [];
}
async function save(){
  const p = JSON.stringify([...earned]); memoryOnly = p;
  try{ if(window.storage) await window.storage.set(KEY,p,false); }catch(e){}
}

/* ---------- modal management ---------- */
function openLearnModal(station) {
  modalBody.innerHTML = '<div class="modal-loading">Loading...</div>';
  learnModal.classList.add("show");
  learnModal.setAttribute("aria-hidden", "false");
  fetchGitHubData(station);
}

function closeLearnModal() {
  learnModal.classList.remove("show");
  learnModal.setAttribute("aria-hidden", "true");
}

async function fetchGitHubData(station) {
  try {
    // Try to fetch repositories related to the topic
    const response = await fetch(`https://api.github.com/search/repositories?q=${station.githubTopic}+topic:education&sort=stars&order=desc&per_page=3`);
    const data = await response.json();
    
    let content = `
      <h2>
        <span class="modal-color-accent" style="background-color: ${station.color}"></span>
        ${station.name}
      </h2>
      <div class="modal-body">
    `;

    if (data.items && data.items.length > 0) {
      content += `<p><strong>Related Educational Resources on GitHub:</strong></p>`;
      data.items.forEach(repo => {
        const description = repo.description || "No description available";
        content += `
          <div style="margin-bottom: 20px; padding: 15px; background: rgba(200,245,49,.08); border-radius: 12px; border-left: 3px solid ${station.color}">
            <p style="margin: 0 0 8px; font-weight: 600; color: var(--paper)">
              <a href="${repo.html_url}" target="_blank" style="color: var(--beacon); text-decoration: none;">${repo.name}</a>
            </p>
            <p style="margin: 0 0 8px; font-size: .9rem">${description}</p>
            <p style="margin: 0; font-size: .85rem; color: rgba(200,245,49,.75)">⭐ ${repo.stargazers_count} stars • ${repo.language || 'Various'}</p>
          </div>
        `;
      });
    } else {
      content += `<p>Learn more about <strong>${station.name}</strong> by exploring community resources and training materials.</p>`;
    }

    // Add general safety information
    const safetyInfo = {
      "bleed": "Stop the Bleed training teaches life-saving techniques for severe bleeding control. The key steps are: <strong>Recognize</strong> severe bleeding, <strong>Act</strong> by applying direct pressure, and <strong>Pack</strong> the wound with gauze if needed.",
      "cpr": "Cardiopulmonary Resuscitation (CPR) is an emergency procedure. Remember: <strong>C</strong>irculation (chest compressions), <strong>A</strong>irway (keep open), <strong>B</strong>reathing (rescue breaths). Push hard and fast at 100-120 compressions per minute.",
      "aed": "Automated External Defibrillators (AEDs) are designed to be used by anyone. The steps are: <strong>Call 911</strong>, <strong>Get the AED</strong>, <strong>Place pads</strong> on the chest, and <strong>Follow voice instructions</strong>."
    };

    if (safetyInfo[station.id]) {
      content += `<div style="margin-top: 20px; padding: 15px; background: rgba(43,179,255,.1); border-radius: 12px; border-left: 3px solid var(--beacon)"><strong>Quick Reference:</strong> ${safetyInfo[station.id]}</div>`;
    }

    content += `</div>`;
    modalBody.innerHTML = content;
  } catch (error) {
    modalBody.innerHTML = `
      <h2>
        <span class="modal-color-accent" style="background-color: ${station.color}"></span>
        ${station.name}
      </h2>
      <div class="modal-error">Unable to fetch GitHub data. <strong>Quick Fact:</strong> ${station.name} - ${station.blurb}</div>
    `;
  }
}

modalClose.addEventListener("click", closeLearnModal);
learnModal.addEventListener("click", (e) => {
  if (e.target === learnModal) closeLearnModal();
});

/* ---------- build ---------- */
STATIONS.forEach(s => {
  const btn = document.createElement("button");
  btn.className="badge"; btn.type="button";
  btn.style.setProperty("--c", s.color);
  btn.dataset.id = s.id;
  btn.setAttribute("aria-pressed","false");
  
  let html = `
    <div class="patch"><svg viewBox="0 0 100 100" aria-hidden="true">${s.icon}</svg></div>
    <h2>${s.name}</h2><p>${s.blurb}</p>
    <span class="status">Tap to collect</span>`;
  
  if (s.hasLearnMore) {
    html += `<div class="badge-controls"><button class="learn-btn" data-station="${s.id}">Learn More</button></div>`;
  }
  
  btn.innerHTML = html;
  btn.addEventListener("click", () => collect(s, btn));
  
  // Add event listener for Learn More button
  if (s.hasLearnMore) {
    const learnBtn = btn.querySelector(".learn-btn");
    learnBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openLearnModal(s);
    });
  }
  
  board.appendChild(btn);
});

function collect(s, btn){
  click();
  if(earned.has(s.id)){
    if(!calm){ btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle"); }
    thud();
    announce.textContent = `${s.name} is already collected.`;
    return;
  }
  earned.add(s.id);
  paint(btn, true);
  collectTone(earned.size);
  if(!calm){
    const patch = btn.querySelector(".patch");
    patch.classList.remove("pop"); void patch.offsetWidth; patch.classList.add("pop");
    sparks(btn, s.color);
  }
  announce.textContent = `${s.name} collected. ${earned.size} of 6.`;
  const done = earned.size === STATIONS.length;
  refresh(); save();
  if(done) setTimeout(fanfare, 380);
}

function paint(btn,on){
  btn.classList.toggle("earned",on);
  btn.setAttribute("aria-pressed",String(on));
  btn.querySelector(".status").textContent = on ? "Collected" : "Tap to collect";
}

function sparks(btn,color){
  const colors=[color,"#ffffff","#ffc53d","#2bb3ff"];
  for(let i=0;i<16;i++){
    const bit=document.createElement("span");
    bit.className="spark";
    const angle=(Math.PI*2*i)/16 + Math.random()*.4;
    const dist=70+Math.random()*55;
    bit.style.setProperty("--dx",`${Math.cos(angle)*dist}px`);
    bit.style.setProperty("--dy",`${Math.sin(angle)*dist}px`);
    bit.style.setProperty("--rot",`${Math.random()*540-270}deg`);
    bit.style.background=colors[i%colors.length];
    bit.style.animationDelay=`${Math.random()*70}ms`;
    btn.appendChild(bit);
    setTimeout(()=>bit.remove(),1000);
  }
}

/* ---------- trace ---------- */
function drawTrace(){
  let d="M 0 60";
  STATIONS.forEach((s,i)=>{
    const cx=100+i*200;
    d+=` L ${cx-60} 60`;
    if(earned.has(s.id)){
      d+=` L ${cx-30} 60 L ${cx-20} 72 L ${cx-8} 60 L ${cx} 12 L ${cx+12} 96 L ${cx+22} 60 L ${cx+34} 60 L ${cx+44} 44 L ${cx+54} 60`;
    }
    d+=` L ${cx+60} 60`;
  });
  d+=" L 1200 60";
  ecg.setAttribute("d",d);
  if(!calm){
    const len=ecg.getTotalLength();
    ecg.style.transition="none";
    ecg.style.strokeDasharray=len; ecg.style.strokeDashoffset=len;
    void ecg.getBoundingClientRect();
    ecg.style.transition="stroke-dashoffset 1s ease-out";
    ecg.style.strokeDashoffset=0;
  }
}
function runScanner(){
  if(calm){ scanner.style.display="none"; return; }
  const period=4200;
  (function step(now){
    const len=ecg.getTotalLength();
    const p=ecg.getPointAtLength(((now%period)/period)*len);
    scanner.setAttribute("cx",p.x); scanner.setAttribute("cy",p.y);
    requestAnimationFrame(step);
  })(0);
}

function refresh(){
  countEl.textContent = earned.size;
  readout.textContent = earned.size===1 ? "1 beat" : `${earned.size} beats`;
  finish.classList.toggle("show", earned.size===STATIONS.length);
  drawTrace();
}

/* ---------- start over ---------- */
let armed=false, armTimer;
resetBtn.addEventListener("click", () => {
  click();
  if(!armed){
    armed=true; resetBtn.classList.add("armed");
    resetBtn.textContent="Tap again to clear";
    armTimer=setTimeout(disarm,3500); return;
  }
  clearTimeout(armTimer); disarm();
  earned.clear();
  document.querySelectorAll(".badge").forEach(b=>paint(b,false));
  announce.textContent="Board cleared. No badges collected.";
  downRun(); refresh(); save();
});
function disarm(){ armed=false; resetBtn.classList.remove("armed"); resetBtn.textContent="Start over"; }

/* ---------- boot ---------- */
const calm = location.search.includes("calm");
const ecg = document.getElementById("ecg");
const scanner = document.getElementById("scanner");
const dry = ac && ac.createGain(), wet = ac && ac.createGain();

(async () => {
  earned = new Set(await load());
  document.querySelectorAll(".badge").forEach(b=>{ if(earned.has(b.dataset.id)) paint(b,true); });
  refresh(); runScanner();
})();
</script>
</body>
